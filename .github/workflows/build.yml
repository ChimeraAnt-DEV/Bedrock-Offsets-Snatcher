name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write  # needed to publish releases (tag job only)

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (wrapped)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      # ubuntu-latest ships a complete Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk)
      # with NDK 27.x / NDK 30 and CMake 3.31. Accept licenses up front so AGP's
      # automatic NDK/CMake provisioner can install any exact-version packages it
      # needs, then build.
      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Android build + JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Native host tests (ELF parser / scanner / extractor / JSON)
        run: |
          cmake -S cpp-tests -B "$RUNNER_TEMP/tests" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/tests" -j "$(nproc)"
          "$RUNNER_TEMP/tests/glowberry_tests"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glowberry-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (wrapped)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
